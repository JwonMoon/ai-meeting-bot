<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}회의록 봇{% endblock %}</title>
{% if refresh %}<meta http-equiv="refresh" content="{{ refresh }}">{% endif %}
<style>
  :root { --fg: #222; --muted: #666; --line: #ddd; --bg: #fff; --box: #f6f6f6; --ok: #2a7; --bad: #c33; --warn: #b80; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); margin: 0; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  header { border-bottom: 1px solid var(--line); }
  header div { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; justify-content: space-between; align-items: baseline; }
  header a { color: inherit; text-decoration: none; font-weight: 600; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  h2 { font-size: 1.05rem; margin: 24px 0 8px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: .9rem; }
  input[type=text], textarea { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid var(--line); border-radius: 4px; font: inherit; }
  textarea { min-height: 3.5em; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--box); cursor: pointer; }
  button.primary { background: #1a5fb4; color: #fff; border-color: #1a5fb4; }
  button.danger { color: var(--bad); }
  .muted { color: var(--muted); font-size: .9rem; }
  .status { display: inline-block; padding: 2px 8px; border-radius: 10px; background: var(--box); font-size: .85rem; }
  .status.failed { background: #fdd; color: var(--bad); }
  .status.review { background: #ffe9b0; color: #7a5200; }
  .status.published { background: #d6f5e3; color: #166534; }
  .error { background: #fdd; color: var(--bad); padding: 8px 12px; border-radius: 6px; margin: 12px 0; }
  .box { background: var(--box); padding: 12px; border-radius: 6px; }
  .events { font-family: ui-monospace, monospace; font-size: .85rem; white-space: pre-wrap; max-height: 20em; overflow: auto; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 12px 0; padding: 8px 12px; }
  legend { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<header><div><a href="/">회의록 봇</a><span class="muted">{% block subtitle %}{% endblock %}</span></div></header>
<main>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
